<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3a1240"/>
      <stop offset="0.6" stop-color="#1a0a2e"/>
      <stop offset="1" stop-color="#0a0618"/>
    </radialGradient>
    <linearGradient id="zon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff5e7e"/>
    </linearGradient>
    <filter id="gloed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="blad">
      <path d="M0 -14 C8 -10 10 0 0 12 C-10 0 -8 -10 0 -14 Z" fill="#ffb7d5"/>
    </g>
  </defs>
  <rect width="840" height="630" fill="url(#bg)"/>
  <!-- stralen -->
  <g opacity="0.18" stroke="#ff8a3d" stroke-width="14">
    <line x1="420" y1="250" x2="40" y2="-40"/><line x1="420" y1="250" x2="230" y2="-60"/>
    <line x1="420" y1="250" x2="420" y2="-60"/><line x1="420" y1="250" x2="610" y2="-60"/>
    <line x1="420" y1="250" x2="800" y2="-40"/><line x1="420" y1="250" x2="880" y2="160"/>
    <line x1="420" y1="250" x2="-40" y2="160"/>
  </g>
  <!-- zon -->
  <circle cx="420" cy="250" r="130" fill="url(#zon)" filter="url(#gloed)"/>
  <g fill="#1a0a2e" opacity="0.35">
    <rect x="290" y="290" width="260" height="10"/><rect x="290" y="318" width="260" height="14"/><rect x="290" y="350" width="260" height="18"/>
  </g>
  <!-- bergen -->
  <path d="M0 470 L170 330 L280 420 L420 290 L560 420 L670 340 L840 470 L840 630 L0 630 Z" fill="#12082a"/>
  <path d="M380 325 L420 290 L460 325 L440 335 L420 322 L400 335 Z" fill="#fff" opacity="0.9"/>
  <!-- speech bubble -->
  <g transform="translate(600 120)" filter="url(#gloed)">
    <path d="M0 0 h150 a24 24 0 0 1 24 24 v56 a24 24 0 0 1 -24 24 h-90 l-30 30 l4 -30 h-34 a24 24 0 0 1 -24 -24 v-56 a24 24 0 0 1 24 -24 z" fill="#fff" stroke="#ff8a3d" stroke-width="6"/>
    <text x="75" y="76" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900" fill="#ff3d7f" text-anchor="middle">!!</text>
  </g>
  <!-- sterretjes -->
  <g fill="#fff" filter="url(#gloed)">
    <path d="M140 120 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <path d="M250 70 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"/>
    <path d="M720 300 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
  </g>
  <!-- bliksem -->
  <path d="M110 230 l60 -10 -30 60 50 -6 -90 110 30 -80 -46 6z" fill="#ffd166" filter="url(#gloed)"/>
  <!-- bloesemblaadjes -->
  <g>
    <use href="#blad" transform="translate(200 210) rotate(20)"/>
    <use href="#blad" transform="translate(320 120) rotate(-30)"/>
    <use href="#blad" transform="translate(560 90) rotate(45)"/>
    <use href="#blad" transform="translate(690 230) rotate(-10)"/>
    <use href="#blad" transform="translate(760 400) rotate(60)"/>
    <use href="#blad" transform="translate(80 420) rotate(-50)"/>
    <use href="#blad" transform="translate(520 470) rotate(15)"/>
    <use href="#blad" transform="translate(300 500) rotate(80)"/>
  </g>
  <!-- titel -->
  <text x="420" y="590" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="#fff" text-anchor="middle"
        stroke="#000" stroke-width="3" paint-order="stroke" filter="url(#gloed)">✦ Anime</text>
  <!-- neonrand -->
  <rect x="14" y="14" width="812" height="602" rx="34" fill="none" stroke="#ff8a3d" stroke-width="8" filter="url(#gloed)"/>
</svg>
